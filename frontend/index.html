<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="icon" type="image/png" href="/images/esakhi-logo-transparent.png" />
    <meta name="description" content="eSakhi — Handmade with Love. Empowered by You. Authentic Indian handicrafts direct from rural women self-help groups." />
    <script>
      (() => {
        const choice = localStorage.getItem('esakhi-theme');
        const theme = choice === 'light' || choice === 'dark' ? choice : 'system';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>eSakhi — Handmade with Love. Empowered by You.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
